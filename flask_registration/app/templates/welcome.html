{% extends "base.html" %}

{% block title %}{{ t.welcome_title }} — MijnApp{% endblock %}
{% block container_class %}container-wide{% endblock %}

{% block content %}
<div class="welcome-hero">
    <div class="welcome-hero__content">
        <h1>{{ t.welcome_title }}</h1>
        <p>{{ t.welcome_subtitle }}</p>
        <div class="welcome-hero__actions">
            <a href="{{ url_for('main.login') }}" class="btn btn-primary">{{ t.welcome_login_btn }}</a>
            <a href="{{ url_for('main.register') }}" class="btn btn-secondary">{{ t.welcome_register_btn }}</a>
        </div>
    </div>
</div>
{% endblock %}
