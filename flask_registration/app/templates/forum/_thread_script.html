{#
  Partial: forum/_thread_script.html
  Het gedrag van de discussie (reageren, takken, bewerken, eens/oneens,
  vertalen, keurmerk). Gebruikt door de gesprekspagina en de cockpit.
#}
<script nonce="{{ csp_nonce() }}">
  (function () {
    var ta  = document.getElementById('composerBody');
    var btn = document.getElementById('composerSubmit');
    if (ta && btn) {
      ta.addEventListener('input', function () { btn.disabled = !ta.value.trim(); });
    }

    // Inline reply forms
    document.querySelectorAll('.gu-post__reply-btn').forEach(function (button) {
      button.addEventListener('click', function () {
        var form = document.getElementById(button.dataset.target);
        if (!form) return;
        form.hidden = !form.hidden;
        if (!form.hidden) form.querySelector('textarea').focus();
      });
    });
    document.querySelectorAll('.gu-post__reply-cancel').forEach(function (button) {
      button.addEventListener('click', function () {
        var form = document.getElementById(button.dataset.target);
        if (form) form.hidden = true;
      });
    });
    document.querySelectorAll('.gu-post__replyform textarea').forEach(function (area) {
      var submitBtn = area.closest('form').querySelector('button[type="submit"]');
      area.addEventListener('input', function () { submitBtn.disabled = !area.value.trim(); });
    });

    // Inklappen en uitklappen van een tak: via het knopje of via de lijn.
    // Puur client-side; de stand wordt niet bewaard.
    function toggleNode(id) {
      var button = document.querySelector('.gu-node__toggle[data-node="' + id + '"]');
      var children = document.getElementById('replies-' + id);
      var note = document.getElementById('collapsed-' + id);
      var line = document.querySelector('.gu-node__line[data-node="' + id + '"]');
      if (!button || !children) return;
      var expanded = button.getAttribute('aria-expanded') === 'true';
      children.hidden = expanded;
      if (line) line.hidden = expanded;
      if (note) note.hidden = !expanded;
      button.setAttribute('aria-expanded', expanded ? 'false' : 'true');
      button.setAttribute('aria-label', expanded ? button.dataset.labelExpand : button.dataset.labelCollapse);
      button.closest('.gu-node').classList.toggle('is-collapsed', expanded);
    }
    document.querySelectorAll('.gu-node__toggle, .gu-node__line').forEach(function (el) {
      el.addEventListener('click', function () { toggleNode(el.dataset.node); });
    });

    // CSRF-token voor de fetch-acties (liken, bericht bewerken); de route
    // valideert het als gewoon formulierveld, net als bij de formulieren.
    var csrfToken = {{ (forum_action_form.csrf_token.current_token if forum_action_form.meta.csrf else '') | tojson }};

    // Delete confirm
    var pageLang = {{ lang | tojson }};
    document.querySelectorAll('.gu-post__delete-form').forEach(function (form) {
      form.addEventListener('submit', function (e) {
        var msg = pageLang === 'nl' ? 'Bericht verwijderen?' : 'Delete this post?';
        if (!confirm(msg)) e.preventDefault();
      });
    });

    // Inline post edit
    document.querySelectorAll('.gu-post__edit-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var postId = btn.dataset.postId;
        var bodyEl = document.getElementById('body-' + postId);
        var form   = document.getElementById('edit-form-' + postId);
        if (!bodyEl || !form) return;
        bodyEl.hidden = true;
        form.hidden = false;
        form.querySelector('textarea').focus();
      });
    });
    document.querySelectorAll('.gu-post__edit-cancel').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var postId = btn.dataset.postId;
        document.getElementById('body-' + postId).hidden = false;
        document.getElementById('edit-form-' + postId).hidden = true;
      });
    });
    document.querySelectorAll('.gu-post__edit-save').forEach(function (btn) {
      var postId = btn.dataset.postId;
      var url    = btn.dataset.url;
      var form   = document.getElementById('edit-form-' + postId);
      var ta     = form.querySelector('textarea');
      var bodyEl = document.getElementById('body-' + postId);
      ta.addEventListener('input', function () { btn.disabled = !ta.value.trim(); });
      btn.addEventListener('click', function () {
        var newBody = ta.value.trim();
        if (!newBody) return;
        btn.disabled = true;
        var fd = new FormData();
        fd.append('body', newBody);
        fd.append('csrf_token', csrfToken);
        var errEl = document.getElementById('edit-error-' + postId);
        if (errEl) errEl.hidden = true;
        fetch(url, { method: 'POST', body: fd, headers: { 'X-Requested-With': 'XMLHttpRequest' } })
          .then(function (r) { return r.json(); })
          .then(function (data) {
            if (data.error) {
              // Bijvoorbeeld: er is intussen een reactie. Als platte tekst.
              if (errEl && data.message) { errEl.textContent = data.message; errEl.hidden = false; }
              return;
            }
            bodyEl.innerHTML = '';
            (data.body || '').split('\n\n').forEach(function (para) {
              var p = document.createElement('p');
              p.textContent = para;
              bodyEl.appendChild(p);
            });
            bodyEl.hidden = false;
            form.hidden = true;
            ta.value = data.body;
            var edited = document.getElementById('edited-' + postId);
            if (edited && data.edited) edited.textContent = '· ' + data.edited;
            // Het oude oordeel hoort bij de oude tekst: weg, en opnieuw pollen
            // tot de nieuwe beoordeling er is (medaille en handhaving).
            var article = document.getElementById('post-' + postId);
            ['quality-', 'qmark-', 'conduct-'].forEach(function (prefix) {
              var el = document.getElementById(prefix + postId);
              if (el) el.innerHTML = '';
            });
            if (article && data.poll_url) {
              article.classList.remove('gu-post--removed');
              article.dataset.qualityPoll = data.poll_url;
              startQualityPoll(article);
            }
          })
          .finally(function () { btn.disabled = false; });
      });
    });

    // Eens/oneens: dezelfde knop nog eens trekt de keuze in, de andere wisselt.
    // X-Requested-With zodat een rate limit (429) als JSON terugkomt.
    document.querySelectorAll('.gu-stance').forEach(function (group) {
      var postId = group.dataset.postId;
      var buttons = group.querySelectorAll('.gu-stance__btn:not([disabled])');
      buttons.forEach(function (button) {
        button.addEventListener('click', function () {
          var fd = new FormData();
          fd.append('csrf_token', csrfToken);
          fd.append('stance', button.dataset.stance);
          buttons.forEach(function (b) { b.disabled = true; });
          fetch('/forum/stance/' + postId, { method: 'POST', body: fd, headers: { 'X-Requested-With': 'XMLHttpRequest' } })
            .then(function (r) { return r.json().catch(function () { return {}; }); })
            .then(function (data) {
              if (typeof data.eens !== 'number') return;
              group.querySelectorAll('.gu-stance__btn').forEach(function (b) {
                var s = b.dataset.stance;
                b.querySelector('.gu-stance__count').textContent = data[s];
                b.classList.toggle('is-mine', data.mine === s);
                b.setAttribute('aria-pressed', data.mine === s ? 'true' : 'false');
              });
            })
            .finally(function () { buttons.forEach(function (b) { b.disabled = false; }); });
        });
      });
    });

    {% include 'forum/_translate_script.html' %}

    // Kwaliteitskeurmerk: de medailleknop vóór de tekst opent en sluit het
    // paneel met de onderbouwing. Via delegatie, zodat het ook werkt voor een
    // knop die de statuspoll later toevoegt. Een <button>, dus Enter en
    // spatie werken vanzelf.
    document.addEventListener('click', function (e) {
      var btn = e.target.closest && e.target.closest('.gu-quality__mark');
      if (!btn) return;
      var panel = document.getElementById(btn.getAttribute('aria-controls'));
      if (!panel) return;
      var open = btn.getAttribute('aria-expanded') === 'true';
      btn.setAttribute('aria-expanded', open ? 'false' : 'true');
      panel.hidden = open;
    });

    // Punt 8: de medaille van een zojuist geplaatste eigen bijdrage verschijnt
    // vanzelf (zonder keurmerk verandert er niets). Elke 2 seconden de status vragen tot hij niet meer
    // pending is, maximaal ongeveer 60 seconden. Blijft het oordeel uit, dan
    // blijft het bericht gewoon staan; bij een volgende paginalading is het er.
    // Ook na een bewerking: dan loopt de beoordeling opnieuw (startQualityPoll
    // wordt dan door de bewerk-code aangeroepen; functiedeclaraties zijn hoisted).
    document.querySelectorAll('[data-quality-poll]').forEach(startQualityPoll);
    function startQualityPoll(article) {
      var url = article.dataset.qualityPoll;
      var postId = article.id.replace('post-', '');
      var started = Date.now();
      function done(data) {
        var slot = document.getElementById('quality-' + postId);
        if (slot && typeof data.html === 'string') slot.innerHTML = data.html;  // door de server gerenderd en ge-escaped
        var mark = document.getElementById('qmark-' + postId);
        // Fase D: de handhavingsuitkomst (verplaatst of verborgen, met reden)
        // voor de auteur, zonder verversen. Door de server gerenderd en ge-escaped.
        if (data.conduct && typeof data.conduct.html === 'string') {
          var cslot = document.getElementById('conduct-' + postId);
          if (cslot) cslot.innerHTML = data.conduct.html;
          article.classList.add('gu-post--removed');
        }
        if (mark && data.status === 'toegekend' && !mark.querySelector('.gu-quality__mark')) {
          var tpl = document.getElementById('gu-quality-mark-template');
          if (tpl) {
            var node = tpl.content.cloneNode(true);
            var btn = node.querySelector('button');
            if (btn) btn.setAttribute('aria-controls', 'qpanel-' + postId);
            mark.appendChild(node);
          }
        }
      }
      function poll() {
        if (Date.now() - started > 60000) return;
        fetch(url, { headers: { 'X-Requested-With': 'XMLHttpRequest' } })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (data) {
            if (!data) return;  // fout of rate limit: stoppen, de pagina blijft gewoon werken
            if (data.status === 'pending') { setTimeout(poll, 2000); return; }
            done(data);
          })
          .catch(function () { setTimeout(poll, 4000); });
      }
      setTimeout(poll, 1500);
    }
  })();
</script>
