<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <title>Global Union — favicon</title>
  <defs>
    <clipPath id="g"><circle cx="16" cy="13" r="12"/></clipPath>
  </defs>

  <!-- globe: cx=16 cy=13 r=12 → left=4 right=28 bottom=25 -->
  <circle cx="16" cy="13" r="12" fill="#3ab0f0"/>
  <g clip-path="url(#g)">
    <ellipse cx="16" cy="13" rx="5" ry="12" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.6"/>
    <ellipse cx="16" cy="13" rx="9" ry="12" fill="none" stroke="#ffffff" stroke-width="0.7" opacity="0.45"/>
    <line x1="4" y1="13" x2="28" y2="13" stroke="#ffffff" stroke-width="0.8" opacity="0.6"/>
    <line x1="6" y1="8" x2="26" y2="8" stroke="#ffffff" stroke-width="0.6" opacity="0.45"/>
    <line x1="6" y1="18" x2="26" y2="18" stroke="#ffffff" stroke-width="0.6" opacity="0.45"/>
  </g>
  <circle cx="16" cy="13" r="12" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="0.8"/>

  <!-- arrows: globe bottom=25, gap 2px → y=27..31 -->
  <!-- centered under globe: left=4 right=28 width=24 -->
  <!-- w=4 g=0.5: 5*4+4*0.5=22 → start=4+(24-22)/2=5 -->
  <path d="M5,27 L5,31 L9,29 Z" fill="#0077CC"/>
  <path d="M10,27 L10,31 L14,29 Z" fill="#333333"/>
  <path d="M15,27 L15,31 L19,29 Z" fill="#EE1C25"/>
  <path d="M20,27 L20,31 L24,29 Z" fill="#F5A800"/>
  <path d="M25,27 L25,31 L29,29 Z" fill="#00A551"/>
</svg>
